name: Release Plugin

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Determine release version
        id: version
        run: |
          RELEASE_VER=$(python3 -c 'import json; print(json.load(open("plugin.json"))["version"].strip())')
          TAG="v${RELEASE_VER}"
          echo "version=${RELEASE_VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists on origin; bump plugin.json & plugin.py version to publish a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Package Trimarr zip
        if: steps.version.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p build/trimarr
          cp plugin.json plugin.py README.md build/trimarr/
          cd build && zip -r ../trimarr.zip trimarr/
          cd ..
          sha256sum trimarr.zip > trimarr.zip.sha256

      - name: Publish GitHub Release
        if: steps.version.outputs.exists != 'true' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Trimarr ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            trimarr.zip
            trimarr.zip.sha256
          generate_release_notes: true
          make_latest: true
